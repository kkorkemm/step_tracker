name: foot_crew
description: Трекер шагов с друзьями и челленджами
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  provider: ^6.1.1
  
  # Шагомер
  pedometer: ^4.0.1
  permission_handler: ^11.0.1
  
  # Хранение данных
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Для работы с датами
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true